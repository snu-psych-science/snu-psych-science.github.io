  bio: 주요 관심 분야는 정신 및 뇌 건강이다. 최근에는 정상 노화 과정을 이탈하는 치매 발현 경로를 탐색하여 사회적 고립, 교육 및 유전자 발현 등의 역할을 확인하는 연구를 진행하고 있다. 연구들은 사회적 네트워크, 뇌영상, 신경면역 분석들을 심리 특질과 측정치들과 통합시켜 복잡한 인지 노화 경로를 밝히는 다학제적 접근법을 사용하고 있다. 이 외에도 치매 검사를 포함한 인지검사들을 출판하고 고등 인지 훈련 프로그램을 개발하였다.
  order: 1
  active: true

