<!-- third party scripts -->
<script src="https://unpkg.com/@popperjs/core@2" defer></script>
<script src="https://unpkg.com/tippy.js@6" defer></script>

<!-- shared site behavior, in dependency order -->
<script src="{{ '/_scripts/anchors.js' | relative_url }}"></script>
<script src="{{ '/_scripts/dark-mode.js' | relative_url }}"></script>
<script src="{{ '/_scripts/image-fallback.js' | relative_url }}"></script>
<script src="{{ '/_scripts/navigation.js' | relative_url }}"></script>
<script src="{{ '/_scripts/table-wrap.js' | relative_url }}"></script>
<script src="{{ '/_scripts/tooltip.js' | relative_url }}"></script>

{% if page.url == "/" %}
  <script src="{{ '/_scripts/home-slideshow.js' | relative_url }}"></script>
{% endif %}

{% if page.url == "/404.html" %}
  <script src="{{ '/_scripts/site-search.js' | relative_url }}"></script>
{% endif %}

{% if page.search %}
  <script src="https://unpkg.com/mark.js@8" defer></script>
  <script src="{{ '/_scripts/search.js' | relative_url }}"></script>
  <script src="{{ '/_scripts/fetch-tags.js' | relative_url }}"></script>
{% endif %}
