<!-- shared site behavior, in dependency order -->
<script src="{{ '/_scripts/anchors.js' | relative_url }}" defer></script>
<script src="{{ '/_scripts/image-fallback.js' | relative_url }}" defer></script>
<script src="{{ '/_scripts/navigation.js' | relative_url }}" defer></script>
<script src="{{ '/_scripts/tooltip.js' | relative_url }}" defer></script>

{% if page.url == "/" %}
  <script src="{{ '/_scripts/event-announcement.js' | relative_url }}" defer></script>
{% endif %}
{% if page.url == "/" or page.url == "/events/" %}
  <script src="{{ '/_scripts/event-status.js' | relative_url }}" defer></script>
{% endif %}

{% if page.url == "/404.html" %}
  <script src="{{ '/_scripts/site-search.js' | relative_url }}" defer></script>
{% endif %}
