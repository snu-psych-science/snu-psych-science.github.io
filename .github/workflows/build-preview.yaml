name: build-preview
run-name: build pull request preview

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the tested preview artifact
        required: false
        type: string
        default: ""

env:
  PREVIEWS_FOLDER: preview

concurrency:
  # This queue prevents preview cleanup and live deployment from racing on gh-pages.
  group: gh-pages-writes
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read

    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Download tested preview artifact
        if: github.event.action != 'closed'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: _site

      - name: Commit preview to Pages branch
        if: github.event.action != 'closed'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          folder: _site
          target-folder: ${{ env.PREVIEWS_FOLDER }}/pr-${{ github.event.number }}
          force: false

      - name: Checkout Pages branch for cleanup
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Remove previews for every closed pull request
        uses: actions/github-script@v9
        with:
          script: |
            const path = require("path");
            const { rm } = require("fs").promises;
            const { PREVIEWS_FOLDER } = process.env;
            const { owner, repo } = context.repo;
            const previewsRoot = path.resolve(process.cwd(), PREVIEWS_FOLDER);
            const closedPulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: "closed", per_page: 100 }
            );

            for (const { number } of closedPulls) {
              const folder = `pr-${number}`;
              const target = path.resolve(previewsRoot, folder);
              if (!/^pr-\d+$/.test(folder) || path.dirname(target) !== previewsRoot)
                throw new Error(`Refusing unsafe preview path: ${target}`);
              await rm(target, { recursive: true, force: true });
            }

      - name: Detect cleanup changes
        id: cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit cleanup only when files changed
        if: steps.cleanup.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: gh-pages
          commit_message: "Clean up closed pull request previews"
