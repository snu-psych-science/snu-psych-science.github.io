name: build-preview
run-name: build pull request preview

on:
  workflow_call:

env:
  PREVIEWS_FOLDER: preview

concurrency:
  # This queue prevents preview cleanup and live deployment from racing on gh-pages.
  group: gh-pages-writes
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout pull request contents
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Ruby packages
        if: github.event.action != 'closed'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Get Pages URL
        if: github.event.action != 'closed'
        id: pages
        uses: actions/configure-pages@v4

      - name: Build preview version of site
        if: github.event.action != 'closed'
        run: bundle exec jekyll build --config _config.yaml --baseurl "${{ steps.pages.outputs.base_path || '' }}/${{ env.PREVIEWS_FOLDER }}/pr-${{ github.event.number }}"
        env:
          JEKYLL_ENV: production

      - name: Commit preview to Pages branch
        if: github.event.action != 'closed'
        uses: rossjrw/pr-preview-action@v1.4.7
        with:
          source-dir: _site
          umbrella-dir: ${{ env.PREVIEWS_FOLDER }}

      - name: Checkout Pages branch for cleanup
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove previews for every closed pull request
        uses: actions/github-script@v7
        with:
          script: |
            const path = require("path");
            const { rm } = require("fs").promises;
            const { PREVIEWS_FOLDER } = process.env;
            const { owner, repo } = context.repo;
            const previewsRoot = path.resolve(process.cwd(), PREVIEWS_FOLDER);
            const closedPulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: "closed", per_page: 100 }
            );

            for (const { number } of closedPulls) {
              const folder = `pr-${number}`;
              const target = path.resolve(previewsRoot, folder);
              if (!/^pr-\d+$/.test(folder) || path.dirname(target) !== previewsRoot)
                throw new Error(`Refusing unsafe preview path: ${target}`);
              await rm(target, { recursive: true, force: true });
            }

      - name: Detect cleanup changes
        id: cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit cleanup only when files changed
        if: steps.cleanup.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: gh-pages
          commit_message: "Clean up closed pull request previews"
