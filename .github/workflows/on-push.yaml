name: on-push
run-name: on push to main

on:
  push:
    branches:
      - main

  # run if user manually requests it
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-site:
    uses: ./.github/workflows/test-site.yaml

  build-site:
    needs: test-site
    uses: ./.github/workflows/build-site.yaml
