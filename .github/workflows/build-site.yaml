name: build-site
run-name: build live site

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the tested site artifact to deploy
        required: true
        type: string

env:
  PREVIEWS_FOLDER: preview

concurrency:
  # Every writer shares one queue because live and preview deployments update gh-pages.
  group: gh-pages-writes
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v7

      - name: Download tested site artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: _site

      - name: Commit live site to Pages branch
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          folder: _site
          clean-exclude: ${{ env.PREVIEWS_FOLDER }}
          force: false
