name: build-site
run-name: build live site

on:
  workflow_call:
  workflow_dispatch:

env:
  PREVIEWS_FOLDER: preview

concurrency:
  # Every writer shares one queue because live and preview deployments update gh-pages.
  group: gh-pages-writes
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branch contents
        uses: actions/checkout@v4

      - name: Install Ruby packages
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Get Pages URL
        id: pages
        uses: actions/configure-pages@v4

      - name: Build live version of site
        run: bundle exec jekyll build --config _config.yaml --baseurl "${{ steps.pages.outputs.base_path || '' }}"
        env:
          JEKYLL_ENV: production

      - name: Commit live site to Pages branch
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          folder: _site
          clean-exclude: ${{ env.PREVIEWS_FOLDER }}
          force: false
