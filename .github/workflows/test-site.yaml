name: test-site
run-name: test site source and generated output

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test source contracts and JavaScript
        run: npm run test:source

      - name: Install Ruby packages
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build production preview-path site
        run: bundle exec jekyll build --config _config.yaml --baseurl "/preview/test"
        env:
          JEKYLL_ENV: production

      - name: Test generated site
        run: npm run test:generated
        env:
          SITE_BASEURL: /preview/test
